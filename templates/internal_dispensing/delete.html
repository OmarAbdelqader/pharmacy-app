{% extends 'base.html' %}
{% block title %}حذف منصرف داخلي{% endblock %}
{% block content %}
<div class="page-header"><h4 class="mb-0">حذف منصرف داخلي</h4></div>
<div class="table-container text-center py-5">
    <h5>هل أنت متأكد من حذف {{ dispensing.dispensing_ref }}؟</h5>
    <p class="text-muted">سيتم عكس تأثير جميع الأصناف على المخزون.</p>
    <form method="post" class="d-inline">{% csrf_token %}<button type="submit" class="btn btn-danger px-4 me-2"><i class="bi bi-trash me-1"></i> نعم، احذف</button><a href="{% url 'internal_dispensing_list' %}" class="btn btn-outline-secondary px-4">إلغاء</a></form>
</div>
{% endblock %}
